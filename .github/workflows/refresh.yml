# Bring the fast-moving sources up to date and propose the result.
#
# Runs on the 15th of each month and on demand. It downloads the newest
# published raw-data bundle, fetches anything newer from the publishers,
# builds, tests, and if any processed output changed opens a pull request
# for review. No auto-merge.
#
# When it opens a pull request it also cuts a raw-data bundle matching the
# data in that pull request, as a *draft* release. The draft is published by
# .github/workflows/publish-bundle.yml when the pull request merges, and
# never selected before then: the verification job builds offline from the
# newest published bundle and requires it to reproduce main, which a bundle
# carrying unmerged data cannot. If the pull request is closed unmerged, the
# draft should be deleted: gh release delete <tag> --yes.
name: Data refresh

on:
  schedule:
    - cron: '0 6 15 * *'  # 06:00 UTC on the 15th of each month
  workflow_dispatch:
    inputs:
      force_bundle:
        description: Cut a draft bundle from the current raw files even if nothing changed (no pull request)
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write  # to dispatch ci.yml onto the pull request branch

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download the newest published raw data bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Drafts are bundles cut for pull requests still under review and
          # must not be selected.
          tag=$(gh release list --json tagName,isDraft \
            --jq '[.[] | select((.tagName | startswith("raw-data-")) and (.isDraft | not))][0].tagName')
          echo "raw bundle: $tag"
          gh release download "$tag" --pattern '*.tar.gz' --output raw-bundle.tar.gz
          tar xzf raw-bundle.tar.gz
          rm raw-bundle.tar.gz
          # The repository's tracked fetch manifest wins over the bundle copy,
          # so the newer-than checks compare against the committed state.
          git checkout -- data/raw/fetch_manifest.json

      - name: Build with fetch
        run: python pipeline/build.py --fetch

      - name: Tests
        run: make test-fast PYTHON=python

      - name: Detect changes
        id: changes
        run: |
          # manifest.json carries a build timestamp that changes every run,
          # so it does not count as a change on its own.
          if git status --porcelain data/processed/ | grep -v 'manifest.json' | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            sources=$(python -c "import json; m = json.load(open('data/raw/fetch_manifest.json'))['sources']; print(', '.join(sorted(k for k, v in m.items() if v.get('status') == 'downloaded')) or 'refreshed sources')")
            month=$(python -c "import datetime, json; m = json.load(open('data/processed/custody_monthly.json'))['meta']['latest_month']; print(datetime.datetime.strptime(m, '%Y-%m').strftime('%B %Y'))")
            echo "sources=$sources" >> "$GITHUB_OUTPUT"
            echo "month=$month" >> "$GITHUB_OUTPUT"
            {
              echo 'diff<<MANIFEST_DIFF'
              git diff data/processed/manifest.json | head -300
              echo 'MANIFEST_DIFF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No processed output changed: the fetched sources carry no new data. No pull request needed."
          fi

      - name: Cut the raw data bundle as a draft release
        id: bundle
        if: steps.changes.outputs.changed == 'true' || inputs.force_bundle == true
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCES: ${{ steps.changes.outputs.sources }}
          MONTH: ${{ steps.changes.outputs.month }}
        run: |
          out=$(python pipeline/make_raw_bundle.py "$RUNNER_TEMP")
          echo "$out"
          tag=$(echo "$out" | sed -n 's/^tag=//p')
          archive=$(echo "$out" | sed -n 's/^archive=//p')
          files=$(echo "$out" | sed -n 's/^files=//p')
          if [ -n "$SOURCES" ]; then
            what="Carries the refresh of ${SOURCES}, with the youth custody series to ${MONTH}."
          else
            what="Cut on demand from the current raw files; no source had changed."
          fi
          gh release create "$tag" "$archive" --draft \
            --title "Raw data bundle, ${tag#raw-data-}" \
            --notes "$(printf '%s\n\n%s\n\n%s\n\n%s' \
              "Raw source files for the PRISM-R pipeline, as listed in RAW_BUNDLE.md inside the archive. ${files} files. All content is public sector information under the Open Government Licence v3.0." \
              "Unpack at the repository root, which expands into data/raw/, then run \`python pipeline/build.py\`." \
              "$what" \
              "Cut by the scheduled refresh as a draft. It is published automatically when the matching pull request merges, and the verification job then rebuilds the repository from it. While it is a draft it describes data not yet on main, and it is not selected by any workflow.")"
          TAG="$tag" python - <<'PY'
          import json, os
          path = "data/raw/fetch_manifest.json"
          manifest = json.load(open(path, encoding="utf-8"))
          manifest.setdefault("meta", {})["bundle_release"] = os.environ["TAG"]
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, ensure_ascii=False, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "draft bundle $tag, $files files, stamped into the fetch manifest"

      - name: Open pull request
        id: pr
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data-refresh
          delete-branch: true
          add-paths: |
            data/processed/
            data/raw/fetch_manifest.json
          commit-message: >-
            Data refresh: ${{ steps.changes.outputs.sources }},
            data as of ${{ steps.changes.outputs.month }}
          title: >-
            Data refresh: ${{ steps.changes.outputs.sources }},
            data as of ${{ steps.changes.outputs.month }}
          body: |
            Automated data refresh from the scheduled workflow. Sources with
            new downloads: ${{ steps.changes.outputs.sources }}. Latest
            custody month: ${{ steps.changes.outputs.month }} (provisional).

            The build ran `pipeline/build.py --fetch` over the raw bundle
            plus freshly fetched sources; `make test-fast` passed. Review the
            manifest diff below, then merge to publish. No auto-merge.

            A raw data bundle matching this data was cut as draft release
            `${{ steps.bundle.outputs.tag }}`. Merging publishes it and the
            verification job then rebuilds the repository from it. If this
            pull request is closed unmerged, delete the draft:
            `gh release delete ${{ steps.bundle.outputs.tag }} --yes`.

            ```diff
            ${{ steps.changes.outputs.diff }}
            ```

      - name: Run CI on the pull request branch
        # The pull request above was opened with the workflow's own token, so
        # GitHub raises no pull_request event for it and ci.yml would never
        # run. Dispatching it directly is the documented exception, and the
        # run's checks attach to the branch head the pull request points at.
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref data-refresh
          echo "dispatched ci.yml on data-refresh for pull request #${{ steps.pr.outputs.pull-request-number }}"
