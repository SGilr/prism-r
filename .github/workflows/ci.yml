name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download the raw data bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --json tagName \
            --jq '[.[] | select(.tagName | startswith("raw-data-"))][0].tagName')
          echo "raw bundle: $tag"
          gh release download "$tag" --pattern '*.tar.gz' --output raw-bundle.tar.gz
          tar xzf raw-bundle.tar.gz
          rm raw-bundle.tar.gz
          # The repository's tracked fetch manifest wins over the bundle copy.
          git checkout -- data/raw/fetch_manifest.json

      - name: Tests
        run: make test-fast PYTHON=python
