# Publish the draft bundle a merged refresh cut.
#
# refresh.yml cuts a raw-data bundle as a draft release when it opens a pull
# request, and stamps the draft's tag into data/raw/fetch_manifest.json,
# which travels in that pull request. When the pull request merges, this
# job reads the stamp from main, points the release at the merge commit so
# the tag names the exact repository state it reproduces, and publishes it.
# Publishing fires verify.yml, which rebuilds main from the bundle.
#
# It also runs on any other push that touches the fetch manifest and does
# nothing unless the stamped release is a draft, so it is safe to run twice.
name: Publish raw data bundle

on:
  push:
    branches: [main]
    paths:
      - data/raw/fetch_manifest.json

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish the draft named by the fetch manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python3 -c "import json; print(json.load(open('data/raw/fetch_manifest.json')).get('meta', {}).get('bundle_release') or '')")
          if [ -z "$tag" ]; then
            echo "the fetch manifest names no bundle; nothing to publish"
            exit 0
          fi
          state=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)
          case "$state" in
            missing)
              echo "::warning::the fetch manifest names $tag but no such release exists; cut one with pipeline/make_raw_bundle.py and publish it by hand"
              exit 0 ;;
            false)
              echo "$tag is already published"
              exit 0 ;;
          esac

          previous=$(gh release list --json tagName,isDraft \
            --jq '[.[] | select((.tagName | startswith("raw-data-")) and (.isDraft | not))][0].tagName')

          gh release edit "$tag" --target "$GITHUB_SHA" --draft=false
          echo "published $tag at $GITHUB_SHA"

          # Leave the previous bundle standing with its asset untouched, and
          # say what replaced it. A published bundle is never rewritten.
          if [ -n "$previous" ] && [ "$previous" != "$tag" ]; then
            name=$(gh release view "$previous" --json name --jq .name)
            case "$name" in *"(superseded)"*) ;; *) name="$name (superseded)";; esac
            body=$(gh release view "$previous" --json body --jq .body)
            gh release edit "$previous" --title "$name" --notes "$(printf '**Superseded by [%s](https://github.com/%s/releases/tag/%s). Take that one.**\n\nReplaced when the refresh carrying newer data merged. The asset is left exactly as published: a release asset is a citable artefact, and a tag that means different bytes on different days cannot be verified against.\n\n%s' "$tag" "$GITHUB_REPOSITORY" "$tag" "$body")"
            echo "marked $previous superseded"
          fi
